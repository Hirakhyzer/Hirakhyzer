<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="Research and engineering focus map">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>
      .title{font:800 27px Arial,Helvetica,sans-serif;fill:#0f172a}
      .label{font:700 18px Arial,Helvetica,sans-serif;fill:#0f172a}
      .desc{font:500 13px Arial,Helvetica,sans-serif;fill:#475569}
      .center{font:800 25px Arial,Helvetica,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1100" height="420" rx="28" fill="url(#bg)"/>
  <text class="title" x="550" y="48" text-anchor="middle">Research + Engineering Focus Map</text>
  <g stroke="#94a3b8" stroke-width="2" opacity=".65">
    <line x1="550" y1="210" x2="250" y2="115"/>
    <line x1="550" y1="210" x2="850" y2="115"/>
    <line x1="550" y1="210" x2="235" y2="300"/>
    <line x1="550" y1="210" x2="865" y2="300"/>
    <line x1="550" y1="210" x2="550" y2="335"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="550" cy="210" r="82" fill="#111827"/>
    <text class="center" x="550" y="202" text-anchor="middle">Computer</text>
    <text class="center" x="550" y="232" text-anchor="middle">Scientist</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="90" y="76" width="320" height="84" rx="22" fill="#e0f2fe" stroke="#06b6d4"/>
    <text class="label" x="250" y="112" text-anchor="middle">AIoT</text>
    <text class="desc" x="250" y="138" text-anchor="middle">Connected devices • sensors • edge intelligence</text>
    <rect x="690" y="76" width="320" height="84" rx="22" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="label" x="850" y="112" text-anchor="middle">Artificial Intelligence</text>
    <text class="desc" x="850" y="138" text-anchor="middle">ML systems • assistants • decision support</text>
    <rect x="75" y="260" width="320" height="84" rx="22" fill="#fee2e2" stroke="#ef4444"/>
    <text class="label" x="235" y="296" text-anchor="middle">Cybersecurity</text>
    <text class="desc" x="235" y="322" text-anchor="middle">Anomaly detection • secure systems • privacy</text>
    <rect x="705" y="260" width="320" height="84" rx="22" fill="#dcfce7" stroke="#22c55e"/>
    <text class="label" x="865" y="296" text-anchor="middle">Cyber-Physical Systems</text>
    <text class="desc" x="865" y="322" text-anchor="middle">Smart infrastructure • digital twins • resilience</text>
    <rect x="390" y="318" width="320" height="72" rx="22" fill="#dbeafe" stroke="#3b82f6"/>
    <text class="label" x="550" y="349" text-anchor="middle">Software Engineering</text>
    <text class="desc" x="550" y="374" text-anchor="middle">Clean architecture • automation • reproducible code</text>
  </g>
</svg>
