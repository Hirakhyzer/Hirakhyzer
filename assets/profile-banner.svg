<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Hira Khyzer GitHub profile banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="15%" r="72%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="86%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity=".46"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity=".36"/></filter>
    <style>
      .title{font:800 56px Arial,Helvetica,sans-serif;fill:#f8fafc;letter-spacing:-1.5px}
      .sub{font:700 25px Arial,Helvetica,sans-serif;fill:#c4b5fd}
      .small{font:500 17px Arial,Helvetica,sans-serif;fill:#cbd5e1}
      .chip{font:700 16px Arial,Helvetica,sans-serif;fill:#e0f2fe}
      .tiny{font:500 13px Arial,Helvetica,sans-serif;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow1)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow2)"/>
  <g opacity=".14" stroke="#e0f2fe" stroke-width="1.1" fill="none">
    <path d="M60 86 C190 30 300 165 430 100 S690 30 850 105 S1030 210 1140 120"/>
    <path d="M90 275 C250 200 405 330 555 245 S805 175 930 260 S1090 320 1160 245"/>
    <path d="M120 45 L310 150 L510 75 L705 185 L935 82 L1110 180"/>
    <path d="M170 315 L330 235 L490 286 L690 205 L870 242 L1088 182"/>
  </g>
  <g opacity=".35">
    <circle cx="104" cy="78" r="5" fill="#22d3ee"/><circle cx="310" cy="150" r="5" fill="#a78bfa"/>
    <circle cx="510" cy="75" r="5" fill="#38bdf8"/><circle cx="705" cy="185" r="5" fill="#22c55e"/>
    <circle cx="935" cy="82" r="5" fill="#f59e0b"/><circle cx="1110" cy="180" r="5" fill="#f472b6"/>
    <circle cx="870" cy="242" r="5" fill="#67e8f9"/><circle cx="330" cy="235" r="5" fill="#818cf8"/>
  </g>
  <g transform="translate(68 72)">
    <text class="title" x="0" y="52">Hira Khyzer</text>
    <text class="sub" x="0" y="90">Computer Scientist</text>
    <text class="small" x="0" y="126">AIoT • Artificial Intelligence • Cybersecurity • Cyber-Physical Systems • Software Engineering</text>
    <g transform="translate(0 162)">
      <rect x="0" y="0" width="112" height="34" rx="17" fill="#0e7490" opacity=".86"/>
      <text class="chip" x="56" y="23" text-anchor="middle">AIoT</text>
      <rect x="128" y="0" width="78" height="34" rx="17" fill="#6d28d9" opacity=".86"/>
      <text class="chip" x="167" y="23" text-anchor="middle">AI</text>
      <rect x="222" y="0" width="145" height="34" rx="17" fill="#b91c1c" opacity=".86"/>
      <text class="chip" x="294" y="23" text-anchor="middle">Cybersecurity</text>
      <rect x="383" y="0" width="108" height="34" rx="17" fill="#047857" opacity=".86"/>
      <text class="chip" x="437" y="23" text-anchor="middle">CPS</text>
      <rect x="507" y="0" width="190" height="34" rx="17" fill="#1d4ed8" opacity=".86"/>
      <text class="chip" x="602" y="23" text-anchor="middle">Software Engineering</text>
    </g>
    <text class="tiny" x="0" y="246">Building secure, intelligent, and human-centered systems for connected digital futures.</text>
  </g>
  <g filter="url(#shadow)" transform="translate(858 70)">
    <rect x="0" y="0" width="244" height="204" rx="30" fill="#020617" opacity=".58" stroke="#334155"/>
    <circle cx="122" cy="82" r="54" fill="#0f172a" stroke="#67e8f9" stroke-width="4"/>
    <text x="122" y="100" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="800" fill="#f8fafc">HK</text>
    <text class="small" x="122" y="160" text-anchor="middle">Research • Engineering</text>
    <text class="tiny" x="122" y="184" text-anchor="middle">AI + Security + Systems</text>
  </g>
